name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  DOCKERHUB_USER: miacox
  IMAGE: miacox/snapchat-export-tools

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm ${{ env.IMAGE }}:test --help
          docker run --rm --entrypoint python ${{ env.IMAGE }}:test /app/snap_chat_media.py --help
          docker run --rm --entrypoint sh ${{ env.IMAGE }}:test -c "ffmpeg -version | head -1 && exiftool -ver"

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=Turn a Snapchat My Data export into dated, geotagged photos and videos
            org.opencontainers.image.authors=Bryan Wodi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```sh
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

      - name: Sync Docker Hub description from README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Turn a Snapchat My Data export into dated, geotagged photos and videos
